[project]
name = "cardforge-backend"
version = "0.1.0"
description = "CardForge — генерация карточек товаров для Ozon и Wildberries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
    "redis>=5.2",
    "arq>=0.26",
    "openpyxl>=3.1.5",
]

# Деплой на Vercel: FastAPI-приложение — переменная app в app/main.py
[tool.vercel]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# File(...) и Depends(...) в аргументах — идиома FastAPI
ignore = ["B008"]
